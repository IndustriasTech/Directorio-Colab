<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio | IndustriasTech</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><circle cx='50' cy='50' r='25' fill='none' stroke='white' stroke-width='12' stroke-dasharray='20 10'/><circle cx='50' cy='50' r='10' fill='white'/></svg>">
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #10b981; --accent-hover: #059669;
            --danger: #ef4444; --border: #334155; --admin: #f59e0b;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid white; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        .spinner-large { width: 40px; height: 40px; border-width: 4px; border-top-color: var(--accent); margin: 0 auto 15px auto; display: block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 20px; }
        .login-box { background-color: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; width: 100%; max-width: 350px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); min-height: 250px; display: flex; flex-direction: column; justify-content: center; }
        .login-box h2 { margin-top: 0; color: var(--accent); }
        input[type="password"], input[type="text"], textarea, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); font-size: 14px; box-sizing: border-box; }
        
        .check-container { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .check-container input { width: auto; margin-right: 10px; }

        button { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; transition: background-color 0.3s; display: flex; align-items: center; justify-content: center; }
        button:hover:not(:disabled) { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover:not(:disabled) { background-color: #dc2626; }
        .btn-admin { background-color: var(--admin); width: auto; margin-right: 10px;}
        .btn-editar { background-color: var(--admin); margin-top: 10px; display: none; }
        .btn-editar:hover:not(:disabled) { background-color: #d97706; }
        
        #dashboard { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }
        
        .logo-link { color: var(--accent); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: opacity 0.3s; }
        .logo-link:hover { opacity: 0.8; }
        .logo-link h1 { margin: 0; font-size: 24px; }
        
        .header-btns { display: flex; }
        .search-bar { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--card-bg); color: var(--text-main); font-size: 16px; margin-bottom: 30px; box-sizing: border-box; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; position: relative; }
        .card h3 { margin: 0 0 10px 0; font-size: 20px; }
        .card p.desc { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; flex-grow: 1; }
        .meta-info { font-size: 13px; background-color: var(--bg-color); padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed var(--border); }
        .meta-info span { display: block; margin-bottom: 5px; }
        .meta-info strong { color: var(--accent); }
        .tag { display: inline-block; background-color: #3b82f6; color: white; font-size: 12px; padding: 4px 8px; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-weight: bold; }
        
        .btn-abrir { display: block; text-align: center; text-decoration: none; background-color: var(--border); color: var(--text-main); padding: 10px; border-radius: 6px; transition: 0.3s; margin-top: auto; font-weight: bold; }
        .btn-abrir:hover { background-color: var(--text-muted); color: var(--bg-color); }
        .btn-eliminar { background-color: var(--danger); margin-top: 10px; display: none; }
        .acciones-admin { display: flex; gap: 10px; }
        .acciones-admin button { flex: 1; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-content h3 { margin-top: 0; color: var(--accent); }
        .modal-content p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        
        #btn-add-float { display: none; margin-bottom: 20px; background-color: var(--accent); }
    </style>
</head>
<body onload="checkAutoLogin()">

    <div id="login-container">
        <div class="login-box">
            <div id="login-ui">
                <h2>IndustriasTech</h2>
                <p>Bóveda de Sistemas</p>
                <input type="password" id="passInput" placeholder="Contraseña maestra" onkeypress="handleEnter(event)">
                <div class="check-container">
                    <input type="checkbox" id="recordarme">
                    <label for="recordarme">Mantener sesión iniciada</label>
                </div>
                <button id="btn-login" onclick="verificarAcceso()">Desencriptar Directorio</button>
            </div>
            <div id="login-loading" style="display: none;">
                <div class="spinner-large"></div>
                <h3 style="color: var(--accent); margin:0;">Autenticando...</h3>
                <p style="color: var(--text-muted); font-size:14px;">Conectando con la base de datos segura</p>
            </div>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <a href="https://industriastech.github.io/Directorio-Colab/" class="logo-link">
                <svg width="30" height="30" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#10b981"/><circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="12" stroke-dasharray="20 10"/><circle cx="50" cy="50" r="10" fill="white"/></svg>
                <h1>Directorio de Sistemas</h1>
            </a>
            <div class="header-btns">
                <button class="btn-admin" onclick="toggleAdmin()" id="btn-admin-toggle">⚙️ Modo Admin</button>
                <button style="width: auto;" class="btn-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
        
        <button id="btn-add-float" onclick="abrirModalForm()">+ Agregar Nuevo Sistema</button>
        <input type="text" id="buscador" class="search-bar" placeholder="🔍 Buscar sistema por título o etiqueta..." onkeyup="filtrarSistemas()">
        
        <div class="grid" id="sistemas-grid"></div>
    </div>

    <!-- Modal Formulario (Sirve para Agregar y Editar) -->
    <div id="modal-formulario" class="modal-overlay">
        <div class="modal-content" style="text-align: left;">
            <h3 id="form-titulo-modal">Agregar Nuevo Sistema</h3>
            <input type="text" id="form-titulo" placeholder="Título del Sistema">
            <textarea id="form-desc" placeholder="Descripción corta" rows="3"></textarea>
            <input type="text" id="form-enlace" placeholder="Enlace (URL)">
            <input type="text" id="form-cuenta" placeholder="Cuenta de Google (Ej. Principal)">
            <input type="text" id="form-tags" placeholder="Etiquetas (separadas por coma)">
            
            <!-- Menú Desplegable para el Estado -->
            <select id="form-estado">
                <option value="" disabled selected>Selecciona el estado...</option>
                <option value="🟢 Activo">🟢 Activo</option>
                <option value="🟡 En Mantenimiento">🟡 En Mantenimiento</option>
                <option value="🔴 Caído / Desactualizado">🔴 Caído / Desactualizado</option>
            </select>

            <input type="text" id="form-notas" placeholder="Notas técnicas o comandos">
            
            <div class="modal-btns">
                <button id="btn-guardar-sis" onclick="guardarSistema()">Guardar Sistema</button>
                <button class="btn-danger" onclick="cerrarModalForm()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-content">
            <h3 id="alerta-titulo">Atención</h3>
            <p id="alerta-mensaje"></p>
            <div class="modal-btns">
                <button id="btn-alerta-ok" onclick="cerrarAlerta()">Aceptar</button>
                <button id="btn-alerta-cancelar" class="btn-danger" style="display:none;" onclick="cerrarAlerta()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz3F62KGe8CCpok1nRkv1gVbhFMw5BAXHOMuD3IG-TpXQrx12pLiz7fqmgu_pYhGnY/exec";
        let sistemasData = [];
        let pwdActual = "";
        let modoAdmin = false;
        let accionConfirmada = null; 
        let filaEnEdicion = null; // Variable para saber si estamos editando

        function mostrarAlerta(mensaje, titulo = "Aviso") {
            document.getElementById('alerta-titulo').innerText = titulo;
            document.getElementById('alerta-mensaje').innerText = mensaje;
            document.getElementById('btn-alerta-cancelar').style.display = "none";
            document.getElementById('btn-alerta-ok').onclick = cerrarAlerta;
            document.getElementById('modal-alerta').style.display = "flex";
        }

        function mostrarConfirmacion(mensaje, titulo, funcionAlAceptar) {
            document.getElementById('alerta-titulo').innerText = titulo;
            document.getElementById('alerta-mensaje').innerText = mensaje;
            document.getElementById('btn-alerta-cancelar').style.display = "block";
            accionConfirmada = funcionAlAceptar;
            
            document.getElementById('btn-alerta-ok').onclick = function() {
                if(accionConfirmada) accionConfirmada();
            };
            document.getElementById('modal-alerta').style.display = "flex";
        }

        function cerrarAlerta() {
            document.getElementById('modal-alerta').style.display = "none";
            accionConfirmada = null;
            document.getElementById('btn-alerta-ok').innerHTML = "Aceptar";
            document.getElementById('btn-alerta-ok').disabled = false;
        }

        function checkAutoLogin() {
            const guardada = localStorage.getItem("industrias_pwd");
            if(guardada) {
                document.getElementById('passInput').value = guardada;
                document.getElementById('recordarme').checked = true;
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('login-loading').style.display = 'flex';
                verificarAcceso();
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') verificarAcceso(); }

        async function verificarAcceso() {
            const password = document.getElementById('passInput').value;
            if(!password) return mostrarAlerta("Ingresa la contraseña maestra para continuar.", "Contraseña Requerida");

            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('login-loading').style.display = 'flex';

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'password': password, 'accion': 'leer_sistemas' }),
                    redirect: 'follow'
                });
                const datos = await res.json();

                if(datos.status === "success") {
                    pwdActual = password;
                    sistemasData = datos.data;
                    
                    if(document.getElementById('recordarme').checked) {
                        localStorage.setItem("industrias_pwd", password);
                    } else {
                        localStorage.removeItem("industrias_pwd");
                    }
                    
                    mostrarDashboard();
                    renderizarTarjetas(sistemasData);
                } else {
                    mostrarAlerta("Contraseña incorrecta. Acceso denegado.", "Error de Seguridad");
                    resetLoginUI();
                }
            } catch (e) {
                mostrarAlerta("No se pudo conectar con la base de datos segura. Revisa tu conexión.", "Error de Red");
                resetLoginUI();
            }
        }

        function resetLoginUI() {
            localStorage.removeItem("industrias_pwd");
            document.getElementById('login-loading').style.display = 'none';
            document.getElementById('login-ui').style.display = 'block';
            document.getElementById('passInput').value = "";
        }

        function cerrarSesion() {
            resetLoginUI();
            pwdActual = "";
            sistemasData = [];
            document.getElementById('dashboard').style.display = "none";
            document.getElementById('login-container').style.display = "flex";
            modoAdmin = false;
            actualizarUIAdmin();
        }

        function mostrarDashboard() {
            document.getElementById('login-container').style.display = "none";
            document.getElementById('dashboard').style.display = "block";
        }

        function formatearEnlace(url) {
            if(!url) return "#";
            let link = url.trim();
            if (!/^https?:\/\//i.test(link)) { link = 'https://' + link; }
            return link;
        }

        function renderizarTarjetas(datos) {
            const grid = document.getElementById('sistemas-grid');
            grid.innerHTML = ""; 

            datos.forEach(sistema => {
                let etiquetasHTML = "";
                if(sistema.etiquetas) {
                    sistema.etiquetas.split(',').forEach(t => {
                        if(t.trim() !== "") etiquetasHTML += `<span class="tag">${t.trim()}</span>`;
                    });
                }

                const linkCorregido = formatearEnlace(sistema.enlace);

                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <h3>${sistema.titulo}</h3>
                    <div style="margin-bottom: 10px;">${etiquetasHTML}</div>
                    <p class="desc">${sistema.descripcion || "Sin descripción."}</p>
                    <div class="meta-info">
                        <span><strong>Cuenta:</strong> ${sistema.cuenta || "N/A"}</span>
                        <span><strong>Estado:</strong> ${sistema.estado || "N/A"}</span>
                        <span><strong>Notas:</strong> ${sistema.notas || "N/A"}</span>
                    </div>
                    <a href="${linkCorregido}" target="_blank" class="btn-abrir">Abrir en Colab 🚀</a>
                    <div class="acciones-admin">
                        <button class="btn-editar" onclick="abrirModalForm(${sistema.fila})">✏️ Editar</button>
                        <button class="btn-eliminar" onclick="iniciarEliminacion(${sistema.fila})">🗑️ Eliminar</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            actualizarUIAdmin();
        }

        function filtrarSistemas() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = sistemasData.filter(s => (s.titulo + " " + (s.etiquetas||"") + " " + (s.descripcion||"")).toLowerCase().includes(texto));
            renderizarTarjetas(filtrados);
        }

        function toggleAdmin() {
            modoAdmin = !modoAdmin;
            actualizarUIAdmin();
        }

        function actualizarUIAdmin() {
            const btnToggle = document.getElementById('btn-admin-toggle');
            const btnAdd = document.getElementById('btn-add-float');
            const btnsDelete = document.querySelectorAll('.btn-eliminar');
            const btnsEdit = document.querySelectorAll('.btn-editar');

            if(modoAdmin) {
                btnToggle.innerText = "❌ Salir de Admin";
                btnAdd.style.display = "block";
                btnsDelete.forEach(b => b.style.display = "block");
                btnsEdit.forEach(b => b.style.display = "block");
            } else {
                btnToggle.innerText = "⚙️ Modo Admin";
                btnAdd.style.display = "none";
                btnsDelete.forEach(b => b.style.display = "none");
                btnsEdit.forEach(b => b.style.display = "none");
            }
        }

        /* --- Lógica del Formulario (Agregar y Editar) --- */
        function abrirModalForm(fila = null) {
            filaEnEdicion = fila;
            const tituloModal = document.getElementById('form-titulo-modal');
            const btnGuardar = document.getElementById('btn-guardar-sis');

            if (fila) {
                // Modo Edición
                tituloModal.innerText = "Editar Sistema";
                btnGuardar.innerText = "Guardar Cambios";
                const sistema = sistemasData.find(s => s.fila === fila);
                
                document.getElementById('form-titulo').value = sistema.titulo;
                document.getElementById('form-desc').value = sistema.descripcion;
                document.getElementById('form-enlace').value = sistema.enlace;
                document.getElementById('form-cuenta').value = sistema.cuenta;
                document.getElementById('form-tags').value = sistema.etiquetas;
                document.getElementById('form-notas').value = sistema.notas;
                
                // Seleccionar el estado correcto si existe en el menú
                const selectEstado = document.getElementById('form-estado');
                selectEstado.value = sistema.estado || "";
                if(selectEstado.selectedIndex === -1) selectEstado.value = ""; // Por si había un texto viejo no compatible

            } else {
                // Modo Agregar Nuevo
                tituloModal.innerText = "Agregar Nuevo Sistema";
                btnGuardar.innerText = "Guardar Sistema";
                document.querySelectorAll('#modal-formulario input, #modal-formulario textarea').forEach(i => i.value = '');
                document.getElementById('form-estado').value = "";
            }

            document.getElementById('modal-formulario').style.display = "flex";
        }

        function cerrarModalForm() { 
            document.getElementById('modal-formulario').style.display = "none"; 
        }

        async function guardarSistema() {
            const btn = document.getElementById('btn-guardar-sis');
            const tituloVal = document.getElementById('form-titulo').value;
            
            if(!tituloVal) return mostrarAlerta("El título es obligatorio para guardar.", "Campo Incompleto");

            btn.innerHTML = `<div class="spinner"></div> Guardando...`;
            btn.disabled = true;
            
            const payload = {
                password: pwdActual, 
                accion: filaEnEdicion ? 'editar_sistema' : 'agregar_sistema', 
                titulo: tituloVal,
                descripcion: document.getElementById('form-desc').value, 
                enlace: document.getElementById('form-enlace').value,
                cuenta: document.getElementById('form-cuenta').value, 
                etiquetas: document.getElementById('form-tags').value,
                estado: document.getElementById('form-estado').value, 
                notas: document.getElementById('form-notas').value
            };

            if (filaEnEdicion) {
                payload.fila = filaEnEdicion;
            }

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(payload),
                    redirect: 'follow'
                });
                
                cerrarModalForm();
                await recargarDatosSilencioso();
            } catch (e) {
                mostrarAlerta("Hubo un error al intentar guardar los datos.", "Error");
            }
            
            btn.disabled = false;
        }

        function iniciarEliminacion(fila) {
            mostrarConfirmacion(
                "¿Estás completamente seguro de que deseas eliminar este sistema? Esta acción borrará el registro de la bóveda de datos y no se puede deshacer.",
                "Confirmar Eliminación",
                function() { ejecutarEliminacion(fila); }
            );
        }

        async function ejecutarEliminacion(fila) {
            const btnOk = document.getElementById('btn-alerta-ok');
            btnOk.innerHTML = `<div class="spinner"></div> Eliminando...`;
            btnOk.disabled = true;
            document.getElementById('btn-alerta-cancelar').style.display = "none";
            
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ password: pwdActual, accion: 'eliminar_sistema', fila: fila }),
                    redirect: 'follow'
                });
                cerrarAlerta();
                await recargarDatosSilencioso();
            } catch(e) {
                cerrarAlerta();
                mostrarAlerta("Fallo al eliminar el sistema.", "Error");
            }
        }

        async function recargarDatosSilencioso() {
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'password': pwdActual, 'accion': 'leer_sistemas' }),
                redirect: 'follow'
            });
            const datos = await res.json();
            if(datos.status === "success") {
                sistemasData = datos.data;
                filtrarSistemas(); 
            }
        }
    </script>
</body>
</html>
