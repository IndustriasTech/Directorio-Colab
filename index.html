<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Sistemas | IndustriasTech</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Pantalla de Login */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-box {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 { margin-top: 0; color: var(--accent); }
        
        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 16px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover { background-color: var(--accent-hover); }

        /* Panel Principal (Oculto al inicio) */
        #dashboard {
            display: none;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 { margin: 0; color: var(--accent); }

        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        /* Grid de Tarjetas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card h3 { margin: 0 0 10px 0; font-size: 20px; }
        .card p.desc { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; flex-grow: 1; }
        
        .meta-info {
            font-size: 13px;
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px dashed var(--border);
        }

        .meta-info span { display: block; margin-bottom: 5px; }
        .meta-info strong { color: var(--accent); }

        .tag {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .btn-abrir {
            display: block;
            text-align: center;
            text-decoration: none;
            background-color: var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-abrir:hover { background-color: var(--text-muted); color: var(--bg-color); }
        #loading { color: var(--accent); font-weight: bold; margin-top: 15px; display: none; }

    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-container">
        <div class="login-box">
            <h2>IndustriasTech</h2>
            <p>Bóveda de Sistemas Colab</p>
            <input type="password" id="passInput" placeholder="Introduce la contraseña" onkeypress="handleEnter(event)">
            <button onclick="verificarAcceso()">Desencriptar Directorio</button>
            <div id="loading">Autenticando y descargando datos...</div>
        </div>
    </div>

    <!-- Panel de Sistemas -->
    <div id="dashboard">
        <div class="header">
            <h1>Directorio de Sistemas</h1>
            <button style="width: auto; background-color: var(--danger);" onclick="cerrarSesion()">Bloquear Bóveda</button>
        </div>
        
        <input type="text" id="buscador" class="search-bar" placeholder="🔍 Buscar sistema por título o etiqueta..." onkeyup="filtrarSistemas()">
        
        <div class="grid" id="sistemas-grid">
            <!-- Las tarjetas se generan aquí con JavaScript -->
        </div>
    </div>

    <script>
        // Tu enlace de Google Apps Script
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwlwUKI1Ppv5V2EU7u5RE-xH008OMqOFDcFt7LOxe4IXdJ16BZMjxegXFEOzXgFsdJY/exec";
        let sistemasData = []; // Guardar los datos para el buscador

        function handleEnter(e) {
            if (e.key === 'Enter') verificarAcceso();
        }

        async function verificarAcceso() {
            const password = document.getElementById('passInput').value;
            const loading = document.getElementById('loading');
            
            if(!password) {
                alert("Por favor, ingresa una contraseña.");
                return;
            }

            loading.style.display = "block";

            try {
                // Hacemos la petición POST al Apps Script
                const respuesta = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        'password': password,
                        'accion': 'leer_sistemas'
                    })
                });

                const datos = await respuesta.json();

                if(datos.status === "success") {
                    sistemasData = datos.data; // Guardamos en memoria
                    mostrarDashboard();
                    renderizarTarjetas(sistemasData);
                } else {
                    alert(datos.message); // Muestra "Acceso Denegado"
                }

            } catch (error) {
                alert("Error de conexión. Revisa tu internet o el enlace del script.");
            } finally {
                loading.style.display = "none";
            }
        }

        function mostrarDashboard() {
            document.getElementById('login-container').style.display = "none";
            document.getElementById('dashboard').style.display = "block";
            document.getElementById('passInput').value = ""; // Limpiar por seguridad
        }

        function cerrarSesion() {
            document.getElementById('dashboard').style.display = "none";
            document.getElementById('login-container').style.display = "flex";
            sistemasData = []; // Borrar de la memoria
            document.getElementById('sistemas-grid').innerHTML = "";
        }

        function renderizarTarjetas(datos) {
            const grid = document.getElementById('sistemas-grid');
            grid.innerHTML = ""; // Limpiar contenedor

            datos.forEach(sistema => {
                // Crear las etiquetas HTML (dividir por comas)
                let etiquetasHTML = "";
                if(sistema.etiquetas) {
                    const tags = sistema.etiquetas.split(',');
                    tags.forEach(t => {
                        etiquetasHTML += `<span class="tag">${t.trim()}</span>`;
                    });
                }

                // Plantilla de la tarjeta
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <h3>${sistema.titulo}</h3>
                    <div style="margin-bottom: 10px;">${etiquetasHTML}</div>
                    <p class="desc">${sistema.descripcion || "Sin descripción."}</p>
                    <div class="meta-info">
                        <span><strong>Cuenta:</strong> ${sistema.cuenta || "N/A"}</span>
                        <span><strong>Estado:</strong> ${sistema.estado || "N/A"}</span>
                        <span><strong>Notas:</strong> ${sistema.notas || "N/A"}</span>
                    </div>
                    <a href="${sistema.enlace}" target="_blank" class="btn-abrir">Abrir en Colab 🚀</a>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarSistemas() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = sistemasData.filter(sis => {
                const contenido = (sis.titulo + " " + sis.etiquetas + " " + sis.descripcion).toLowerCase();
                return contenido.includes(texto);
            });
            renderizarTarjetas(filtrados);
        }
    </script>
</body>
</html>
